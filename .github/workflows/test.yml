name: Test Suite

on:
  push:
    branches: [main, develop, refactor_code_cleanup_mordenization]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
      fail-fast: false # Continue testing other versions if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Cache pip dependencies for faster runs

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist # Additional test tools

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short --cov=alpha_tech_tracker --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.8' # Only upload once
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false # Don't fail if coverage upload fails
        continue-on-error: true

      - name: Upload test results
        if: always() # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Test suite completed!"
          echo "Check individual job results above for details."
