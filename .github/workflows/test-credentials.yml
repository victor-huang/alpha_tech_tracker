name: Integration Tests (with Credentials)

# Only run manually - requires API credentials
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which integration tests to run'
        required: true
        type: choice
        options:
          - all
          - alpaca
          - etrade
        default: 'alpaca'

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alpaca tests
        if: inputs.test_type == 'alpaca' || inputs.test_type == 'all'
        env:
          PYTHONPATH: .
          TWILIO_ACCOUNT_ID: test
          TWILIO_AUTH_TOKEN: test
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          pytest tests/ -m "alpaca" -v --tb=short
        continue-on-error: true

      - name: Run ETrade tests
        if: inputs.test_type == 'etrade' || inputs.test_type == 'all'
        env:
          PYTHONPATH: .
          TWILIO_ACCOUNT_ID: test
          TWILIO_AUTH_TOKEN: test
          ETRADE_API_KEY_ID: ${{ secrets.ETRADE_API_KEY_ID }}
          ETRADE_API_SECRET_KEY: ${{ secrets.ETRADE_API_SECRET_KEY }}
        run: |
          pytest tests/ -m "etrade" -v --tb=short
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "Integration tests completed!"
          echo "Test type: ${{ inputs.test_type }}"
          echo ""
          echo "Note: Tests may fail if API credentials are not configured in GitHub Secrets"
