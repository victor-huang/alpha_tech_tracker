[pytest]
# Pytest configuration for Alpha Tech Tracker

# Custom markers for test categorization
markers =
    core: Core tests that don't require external credentials (runs by default)
    credentials: Tests requiring API credentials (Alpaca or ETrade)
    alpaca: Tests requiring Alpaca API credentials
    etrade: Tests requiring ETrade API credentials
    integration: Integration tests (real sockets/threads/external services). Excluded from default runs; run with `pytest -m integration` or by file path.
    slow: Tests that take a long time to run

# Default test paths
testpaths = tests

# Python files to consider for test discovery
python_files = test_*.py

# Python classes to consider for test discovery
python_classes = Test*

# Python functions to consider for test discovery
python_functions = test_*

# Minimum version
minversion = 6.0

# Additional options
addopts =
    --strict-markers
    --verbose
    --color=yes
